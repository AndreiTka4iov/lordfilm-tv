name: lordfilm-tv-static
services:
  app:
    image: lordfilm-tv:static
    build:
      context: .
      dockerfile: Dockerfile.static
      args:
        NEXT_PUBLIC_CATALOG_API_URL: '${NEXT_PUBLIC_CATALOG_API_URL:-}'
    init: true
    restart: unless-stopped
    ports:
      - '${HOST_BIND:-127.0.0.1}:${FRONTEND_OUT_PORT:-3000}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
