name: CI
on: [push, pull_request]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run build:export
      - run: docker compose -f docker-compose.dev.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.static.yml config --quiet
      - run: docker build -t lordfilm-tv:ci .
      - run: docker build -f Dockerfile.static -t lordfilm-tv:static-ci .
      - run: docker compose -f docker-compose.api.yml config --quiet
      - run: docker build -f Dockerfile.dev -t lordfilm-tv:dev-ci .
      - run: docker build -f Dockerfile.api -t lordfilm-tv:api-ci .
