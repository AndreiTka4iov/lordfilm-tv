name: CI
on: [push, pull_request]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run build:export
      - run: docker compose -f docker-compose.dev.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.static.yml config --quiet
      - run: docker build -t lordfilm-tv:ci .
      - run: docker build -f Dockerfile.static -t lordfilm-tv:static-ci .
      - run: docker compose -f docker-compose.api.yml config --quiet
      - run: docker build -f Dockerfile.dev -t lordfilm-tv:dev-ci .
      - run: docker build -f Dockerfile.api -t lordfilm-tv:api-ci .

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:android:web
      - run: ./gradlew checkKotlinFormat testDebugUnitTest lintDebug verifyDebugWebAssets verifyReleaseWebAssets --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: lordfilm-tv-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lordfilm-tv-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
